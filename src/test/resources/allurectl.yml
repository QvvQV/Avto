image: Ubuntu2004  # образ для сборки

stack: jdk 24.0.2  # версия JDK

variables:
  Allure_LAUNCH_NAME: "Тестирование"

branches:
  only:
    - main  # ветка git

build: off  # будем использовать свой скрипт сборки

install:
  # запускаем SUT (& означает, что в фоновом режиме не блокируем терминал для запуска тестов)
#  - java -jar ./artifacts/app-card-delivery.jar &
#  - chmod +x gradlew
  - allure generate
  - allure serve

build_script:
  - mvn test  # запускаем тест, флаг --info позволяет выводить больше информации