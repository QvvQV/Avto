.allurectl-login:
  before_script:
    - ./allurectl auth login --endpoint $ALLURE_ENDPOINT --token $ALLURE_TOKEN

stages:
  - run_tests

variables:
  ALLURE_LAUNCH_TAGS: "Branch - ${CI_COMMIT_REF_NAME}, Medium API tests"
  ALLURE_TESTPLAN_PATH: "target/testplan.json"
  ALLURE_RESULTS: "target/allure-results/"
  TESTS_BRANCH: ${CI_COMMIT_REF_NAME}

test:
  stage: run_tests
  image: gradle
  extends: .allurectl-login
  variables:
    ALLURE_ENDPOINT: https://testops.tutormail.ru
    ALLURE_PROJECT_ID: 1
    ALLURE_RESULTS: build/allure-results
  before_script:
    - curl -fsSL https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64 -o allurectl
    - chmod +x allurectl
    - gradle init
  script:
    - ./allurectl watch -- maven clean test
  after_script:
    - "Uploading reports..."
  artifacts:
    reports:
      junit:
        - "./pom.xml"