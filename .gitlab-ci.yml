export ALLURE_RESULTS="logs/allure-results"
export ALLURE_TOKEN="a7f548a0-34bf-4992-9de6-97c3e2ace87f"
export ALLURE_ENDPOINT="https://testops.tutormail.ru"
export ALLURE_PROJECT_ID=1
export SLACK_WEBHOOK_ID=
export ALLURE_LAUNCH_NAME="first run" # you can use here the environment variables of your job/pipeline

echo "DEBUG: Проверка CI-переменных"
env | grep -E 'CI_|PROJECT_URL|PIPELINE_ID'

if [ -z "$TAGS_TO_RUN" ]; then
  TAGS_TO_RUN="not alert_definition"
fi
export ALLURE_LAUNCH_TAGS="release, critical, ${DEPLOYMENT_ENV},${TAGS_TO_RUN} "

start_time=$(date +%s)

# printenv
echo "Run customer setup"

#python3 setup_env.py

echo "============="
echo "Run tests"
echo "============="

allurectl watch -- bash -c "
    pytest -n 8 --reruns 2  -m '$TAGS_TO_RUN' --alluredir=logs/allure-results || true
" | tee -a allure_output.txt

LAUNCH_ID=$(grep -o 'Launch \[[0-9]*\]' allure_output.txt | grep -o '[0-9]*')
echo "Тесты завершены"
echo "============="

echo "Замеряем время"
end_time=$(date +%s)
elapsed=$((end_time - start_time))
hours=$((elapsed / 3600))
minutes=$(( (elapsed % 3600) / 60 ))
seconds=$((elapsed % 60))
export $(allurectl job-run env)

launch_url=$(grep -E "https://testops_url/launch/[0-9]+" allure_output.txt | head -n 1)
response=$(curl "${ALLURE_ENDPOINT}/api/rs/launch/${LAUNCH_ID}/statistic" \
     --header "Accept: application/json" \
     --header "Authorization: Api-Token ${ALLURE_TOKEN}")

# Extracting individual statistics using jq
failed=$(echo $response | jq -r '.[] | select(.status == "failed") | .count // 0')
failed=${failed:-0}
broken=$(echo $response | jq -r '.[] | select(.status == "broken") | .count // 0')
broken=${broken:-0}
passed=$(echo $response | jq -r '.[] | select(.status == "passed") | .count // 0')
passed=${passed:-0}
skipped=$(echo $response | jq -r '.[] | select(.status == "skipped") | .count // 0')
skipped=${skipped:-0}
total=$((failed + broken + passed + skipped))

# Running the Python script and passing the values as arguments
python3 generate_chart.py "$total" "$passed" "$failed" "$broken" "$skipped"

IMAGE_URL=$(curl --silent --request POST "https://api.imgur.com/3/image" \
--header "Authorization: " \
--form "image=@chart.png" | jq -r '.data.link')


slack_webhook_url="https://hooks.slack.com/services/${SLACK_WEBHOOK_ID:-}"
time_message="${hours} h ${minutes} m ${seconds} s"
message="*Test Results* \n
• *Launch URL:* ${launch_url} \n
• *Tags:* ${ALLURE_LAUNCH_TAGS:-} \n
• *Total Tests:* ${total} \n
    - Passed: ${passed} \n
    - Failed: ${failed} \n
    - Broken: ${broken} \n
    - Skipped: ${skipped} \n
• *Execution Time:* ${time_message} \n
${skip_block}"

curl -X POST -H 'Content-type: application/json' --data '{
    "text": "'"${message}"'",
    "attachments": [
        {
            "fallback": "Изображение",
            "image_url": "'"${IMAGE_URL}"'",
            "text": "Вот ваше изображение"
        }
    ]
}' "$slack_webhook_url"