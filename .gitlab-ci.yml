image: openjdk:11-jdk-slim

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=./.m2/repository"
stages:
  - build
  - test
  - package

build:
  stage: build
  script:
    - 'mvn compiler:compile'
  cache:
    paths:
      - ./target
      - ./.m2

test:
  stage: test
  #image: maven:3.8.2-openjdk-11
  image: gradle
  variables:
    ALLURE_ENDPOINT: https://testops.tutormail.ru
    ALLURE_PROJECT_ID: 1
    ALLURE_RESULTS: builds/allure-results
    PRODUCT_VERSION: '1.23'
    TESTS_BROWSER: chrome
    ALLURE_REPORT_DIR: allure-report
  before_script:
    - curl -fsSL https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64 -o allurectl
    - chmod +x allurectl

  script:
    #- ./allurectl watch -- mvn clean test
    - ./allurectl watch -- mvn test
    #- mvn clean test
  cache:
    paths:
      - ./target
      - ./.m2

package:
  stage: package
  script:
    - 'mvn package -Dmaven.test.skip=true'
  artifacts:
    paths:
      - target/*.jar
