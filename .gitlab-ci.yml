  cache:
    paths:
      - .m2/repository
  build:
    stage: build
    script:
      - mvn compile
  test:
    stage: test
    image: maven:latest

    variables:
      ALLURE_ENDPOINT: https://testops.tutormail.ru/project
      ALLURE_PROJECT_ID: 1
      ALLURE_RESULTS: target/site/allure-results
    before_script:
      - wget https://github.com/allure-framework/allurectl/releases/tag/2.17.0/allurectl_windows_386 -0 /usr/bin/allurectl
      - allurectl job-run start
    script:
      - ./allurectl watch -- maven clean test
