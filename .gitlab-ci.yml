stages:
  - build
  - test
  - report

variables:
  # Переменные для Java и Maven/Gradle
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  # Переменные для Allure
  ALLURE_RESULTS_DIR: "allure-results"
  ALLURE_REPORT_DIR: "allure-report"

# Этап сборки проекта
build:
  stage: build
  script:
    - echo "Сборка проекта..."
    - mvn install # Сборка без тестов

# Этап выполнения тестов и генерации отчётов Allure
test:
  stage: test
  script:
    - echo "Запуск тестов и генерация отчётов Allure..."
    - mvn test -Dallure.results.directory=$ALLURE_RESULTS_DIR $MAVEN_OPTS # Выполнение тестов
    - allure generate $ALLURE_RESULTS_DIR --clean -o $ALLURE_REPORT_DIR # Генерация отчёта
  dependencies:
    - build # Зависит от успешной сборки

# Этап просмотра отчёта
report:
  stage: report
  script:
    - echo "Отчёт сгенерирован. Можно просмотреть артефакты."
  artifacts:
    paths:
      - $ALLURE_REPORT_DIR
    expire_in: 1 week # Указываем срок хранения артефактов
