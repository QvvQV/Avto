image: openjdk:11-jdk-slim

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=./.m2/repository"
stages:
  - test
  - report
  - deploy

test:
  stage: test
  image: maven:3.8.2-openjdk-11
  #image: gradle
  variables:
    ALLURE_ENDPOINT: https://testops.tutormail.ru
    ALLURE_PROJECT_ID: 1
    ALLURE_RESULTS: builds/allure-results
    PRODUCT_VERSION: '1.23'
    TESTS_BROWSER: chrome
    ALLURE_REPORT_DIR: allure-report
  before_script:
    - curl -fsSL https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64 -o allurectl
    - chmod +x allurectl

  script:
    #- ./allurectl watch -- mvn clean test
    - mvn install
    - allure install
    - ./allurectl watch -- mvn test
    #- mvn clean test

report:
  stage: allure
  when: always
  image:
    name: ubuntu:latest
    endpoint: [""]
  before_script:
    - apt-get update
    - apt-get install -y default-jdk wget inzip
    - mkdir /work/
    - wget https://github.com/allure-framework/allure2/releases/download/2.13.8/allure-2.13.8.zip -P /work/
    - unzip /work/allure-2.13.8.zip -d /work/
  script:
    - /work/allure-2.13.8/bin/allure generate allure-results --clean -o allure-report
  artifacts:
    when: always
    paths:
      - allure-report/
      - allure-results/
  only:
    - master

pages:
  stage: deploy
  when: always
  dependencies:
    - allure_report
  script:
    - mv allure-report/ public/
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - master



