image: openjdk:11-jdk-slim
stage:
  - build
  - test

cache:
  key:
    files:
      - build.gradle
    paths:
      - .gradle-cache
variables:
  GRADLE_USER_HOME: '.gradle-cache'

build:
  stage: build
  script:
    - ./gradlew build -x test

test:
  stage: test
  #image: maven:3.8.2-openjdk-11
  image: gradle
  variables:
    ALLURE_ENDPOINT: https://testops.tutormail.ru
    ALLURE_PROJECT_ID: 1
    ALLURE_RESULTS: builds/allure-results
    PRODUCT_VERSION: '1.23'
    TESTS_BROWSER: chrome
    ALLURE_REPORT_DIR: allure-report
  before_script:
    - curl -fsSL https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64 -o allurectl
    - chmod +x allurectl


  script:
    #- ./allurectl watch -- mvn clean test
    - ./allurectl watch -- gradlew clean test
    #- mvn clean test
  artifacts:
    when: always
    expire_in: 1 week # Время хранения артефактов
    #paths:
     #- allure-results # Путь к сгенерированным отчетам
    reports:
      junit:
        - builds/allure-results/test/TEST-*.xml

dockerize:
  stage: package
  script:
    - docker build -t spring-boot-realworld-example-app: $CI_JOB_ID
   
  #after_script:
   # stage: report
   #   - mvn ./allure-results
   #   - allure generate allure-results -o

  
