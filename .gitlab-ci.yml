stages:
  - test
  - report

run_tests:
  stage: test
  image: your_test_runner_image # e.g., cypress/base:10
  script:
    - mvn install
    - mvn clean test --reporter allure-cypress # Example for Cypress
  artifacts:
    paths:
      - allure-results

generate_allure_report:
  stage: report
  image: franela/allure-docker:latest
  script:
    - allure generate --clean allure-results -o allure-report
  artifacts:
    paths:
      - allure-report
    expire_in: 1 week

pages: # Optional, for GitLab Pages deployment
  stage: report
  image: alpine:latest
  script:
    - mv allure-report public
  artifacts:
    paths:
      - public
  only:
    - master # Or your main branch      